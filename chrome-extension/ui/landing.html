<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Collector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
        }

        .user-info {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .feature-selection {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            max-width: 700px;
            width: 100%;
            height: 100%;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .welcome-text h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .welcome-text p {
            color: #6b7280;
            font-size: 11px;
        }

        .features-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .feature-card {
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(255,255,255,0.3);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .feature-card:hover {
            background: rgba(255,255,255,1);
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .feature-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .feature-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .header { 
            padding: 20px; 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-section {
            display: none; /* Hide old logout section */
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(239,68,68,0.3);
        }

        .logout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239,68,68,0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h3>Evidence Collector</h3>
        </div>
        <div>
            <div class="user-info" id="userInfo"></div>
            <button class="logout-btn" id="logoutBtn" style="font-size: 18px; margin-top: 8px; margin-left: auto; display: block; padding: 4px 10px;" title="Logout">⏻</button>
        </div>
    </div>
    </div>

    <div class="main-container">
        <div class="feature-selection">
            <div class="welcome-text">
                <h2>Choose Your Workflow</h2>
                <p>Select how you'd like to collect compliance evidence</p>
            </div>

            <div class="features-grid">
                <a href="sidepanel.html" class="feature-card">
                    <span class="feature-icon">⚡</span>
                    <h3>Evidence Collector</h3>
                    <p>Execute pre-built workflows and interactive AI-guided evidence collection</p>
                </a>

                <a href="workflow-designer.html" class="feature-card">
                    <span class="feature-icon">🤖</span>
                    <h3>AI Workflow Designer</h3>
                    <p>Upload documents and let AI generate custom compliance workflows</p>
                </a>
            </div>
        </div>
    </div>

    <script src="../landing.bundle.js"></script>
</body>
</html>
