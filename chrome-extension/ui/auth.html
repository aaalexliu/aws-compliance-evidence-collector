<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 100%; 
      height: 100vh; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container { 
      background: white; 
      padding: 40px; 
      border-radius: 16px; 
      width: 270px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .form-group { 
      margin-bottom: 24px; 
      text-align: left;
    }
    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 14px; 
      font-weight: 500;
      color: #374151;
    }
    input { 
      width: 100%; 
      padding: 14px; 
      border: 2px solid #e5e7eb; 
      border-radius: 8px; 
      background: #f9fafb; 
      color: #111827; 
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      background: white;
    }
    button { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
    }
    button:disabled { 
      background: #9ca3af; 
      cursor: not-allowed; 
      transform: none;
    }
    .error { 
      color: #dc2626; 
      font-size: 12px; 
      margin-top: 10px; 
    }
    .setup-link { 
      color: #3b82f6; 
      cursor: pointer; 
      text-decoration: none; 
      font-size: 13px;
      margin-top: 20px;
      font-weight: 500;
    }
    .setup-link:hover {
      text-decoration: underline;
    }
    h2 { 
      margin-top: 0; 
      margin-bottom: 30px;
      color: #1f2937;
      font-size: 24px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Evidence Collector</h2>
    
    <div id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" />
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" />
      </div>
      
      <button id="loginButton">Sign In</button>
      <div id="loginError" class="error"></div>
      
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 16px;">
        <div class="setup-link" id="setupLink">Configure Settings</div>
        <div class="setup-link" id="viewSettingsLink">View Settings</div>
      </div>
    </div>
    
    <div id="passwordChangeForm" style="display: none;">
      <p style="font-size: 13px; color: #6b7280; margin-bottom: 20px; line-height: 1.5;">
        Temporary password detected. Please create a new permanent password.
      </p>
      
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" />
        <div style="font-size: 11px; color: #6b7280; margin-top: 4px;">
          Min 8 chars, must include uppercase, lowercase, number, symbol
        </div>
      </div>
      
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" />
      </div>
      
      <button id="changePasswordButton">Change Password</button>
      <div id="passwordChangeError" class="error"></div>
    </div>
    
    <div id="setupForm" style="display: none;">
      <div class="form-group">
        <label>S3 Bucket Name</label>
        <input type="text" id="s3BucketName" placeholder="my-evidence-bucket" />
      </div>
      
      <div class="form-group">
        <label>Identity Pool ID</label>
        <input type="text" id="identityPoolId" placeholder="us-east-1:xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
      </div>
      
      <div class="form-group">
        <label>User Pool ID</label>
        <input type="text" id="userPoolId" placeholder="us-east-1_xxxxxxxxx" />
      </div>
      
      <div class="form-group">
        <label>Client ID</label>
        <input type="text" id="clientId" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxx" />
      </div>
      
      <div class="form-group">
        <label>Region</label>
        <input type="text" id="region" placeholder="us-east-1" value="us-east-1" />
      </div>
      
      <button id="saveConfigButton">Save Configuration</button>
      <div id="setupError" class="error"></div>
      
      <div class="setup-link" id="backToLogin">Back to login</div>
    </div>
  </div>
  
  <script src="../auth.bundle.js"></script>
</body>
</html>
